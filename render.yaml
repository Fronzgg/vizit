services:
  - type: web
    name: olga-korzun
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
    disk:
      name: olga-korzun-data
      mountPath: /var/data
      sizeGB: 1
